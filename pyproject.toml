[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-simulation-mcp"
version = "0.1.0"
description = "Local-first, evidence-driven Marketplace Simulation protocol and behavior analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
surrogate = ["scikit-learn>=1.5"]

[project.scripts]
marketplace-mcp = "marketplace_mcp.server:main"
marketplace-discover = "marketplace_mcp.discovery.cli:main"
marketplace-scan-evidence = "marketplace_mcp.security.evidence_scan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
