[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-simulation-sysid"
version = "0.2.0"
description = "Publication gate, REA Evidence ingestion and system-identification planning for Marketplace Simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
surrogate = ["scikit-learn>=1.5"]

[project.scripts]
marketplace-scan-evidence = "marketplace_sysid.security.evidence_scan:main"
marketplace-rea-ingest = "marketplace_sysid.rea_ingest:main"
mpsim = "marketplace_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src", "scripts", "tests"]
exclude = ["^legacy/"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
